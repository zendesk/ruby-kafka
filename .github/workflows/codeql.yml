name: "CodeQL public repository scanning"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '20 14 * * 6'

permissions:
  contents: read
  security-events: write
  actions: read
  packages: read

jobs:
  trigger-codeql:
    uses: zendesk/prodsec-code-scanning/.github/workflows/codeql_advanced_shared.yml@production
