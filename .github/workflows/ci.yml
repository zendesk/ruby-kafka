name: CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    env:
      LOG_LEVEL: DEBUG

    strategy:
      fail-fast: false
      matrix:
        ruby-version:
          - "2.7.1"

    steps:
    - uses: actions/checkout@v5

    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y cmake

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby-version }}
        bundler-cache: true

    - name: Run RSpec
      run: bundle exec rspec

    - name: Run Rubocop
      run: bundle exec rubocop

  functional-wurstmeister:
    runs-on: ubuntu-latest
    env:
      LOG_LEVEL: DEBUG

    strategy:
      fail-fast: false
      matrix:
        kafka-version:
          - "2.11-0.11.0.3"
          - "2.11-1.0.2"
          - "2.11-1.1.1"
          - "2.11-2.0.1"
          - "2.12-2.1.1"
          - "2.12-2.2.1"
          - "2.12-2.3.1"
          - "2.12-2.4.0"
          - "2.12-2.5.0"
          - "2.13-2.6.0"

    services:
      zookeeper:
        image: wurstmeister/zookeeper
        ports:
          - 2181:2181

    steps:
    - uses: actions/checkout@v5

    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y cmake

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: "2.7.1"
        bundler-cache: true

    - name: Start Kafka brokers
      run: |
        # Start Kafka broker 1 on port 9092
        docker run -d --name kafka1 \
          --network host \
          -e KAFKA_ADVERTISED_HOST_NAME=localhost \
          -e KAFKA_ADVERTISED_PORT=9092 \
          -e KAFKA_PORT=9092 \
          -e KAFKA_ZOOKEEPER_CONNECT=localhost:2181 \
          -e KAFKA_DELETE_TOPIC_ENABLE=true \
          wurstmeister/kafka:${{ matrix.kafka-version }}

        # Start Kafka broker 2 on port 9093
        docker run -d --name kafka2 \
          --network host \
          -e KAFKA_ADVERTISED_HOST_NAME=localhost \
          -e KAFKA_ADVERTISED_PORT=9093 \
          -e KAFKA_PORT=9093 \
          -e KAFKA_ZOOKEEPER_CONNECT=localhost:2181 \
          -e KAFKA_DELETE_TOPIC_ENABLE=true \
          wurstmeister/kafka:${{ matrix.kafka-version }}

        # Start Kafka broker 3 on port 9094
        docker run -d --name kafka3 \
          --network host \
          -e KAFKA_ADVERTISED_HOST_NAME=localhost \
          -e KAFKA_ADVERTISED_PORT=9094 \
          -e KAFKA_PORT=9094 \
          -e KAFKA_ZOOKEEPER_CONNECT=localhost:2181 \
          -e KAFKA_DELETE_TOPIC_ENABLE=true \
          wurstmeister/kafka:${{ matrix.kafka-version }}

        # Wait for Kafka to be ready
        sleep 30

    - name: Run functional tests
      run: bundle exec rspec --profile --tag functional spec/functional

  functional-bitnami:
    runs-on: ubuntu-latest
    env:
      LOG_LEVEL: DEBUG

    strategy:
      fail-fast: false
      matrix:
        kafka-version:
          - "2.7.0"

    services:
      zookeeper:
        image: zookeeper:latest
        ports:
          - 2181:2181
        env:
          ALLOW_ANONYMOUS_LOGIN: yes

    steps:
    - uses: actions/checkout@v5

    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y cmake

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: "2.7.1"
        bundler-cache: true

    - name: Start Kafka brokers
      run: |
        # Start Kafka broker 1 on port 9092
        docker run -d --name kafka1 \
          --network host \
          -e ALLOW_PLAINTEXT_LISTENER=yes \
          -e KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092 \
          -e KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9092 \
          -e KAFKA_CFG_ZOOKEEPER_CONNECT=localhost:2181 \
          -e KAFKA_DELETE_TOPIC_ENABLE=true \
          bitnamilegacy/kafka:${{ matrix.kafka-version }}

        # Start Kafka broker 2 on port 9093
        docker run -d --name kafka2 \
          --network host \
          -e ALLOW_PLAINTEXT_LISTENER=yes \
          -e KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9093 \
          -e KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9093 \
          -e KAFKA_CFG_ZOOKEEPER_CONNECT=localhost:2181 \
          -e KAFKA_DELETE_TOPIC_ENABLE=true \
          bitnamilegacy/kafka:${{ matrix.kafka-version }}

        # Start Kafka broker 3 on port 9094
        docker run -d --name kafka3 \
          --network host \
          -e ALLOW_PLAINTEXT_LISTENER=yes \
          -e KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9094 \
          -e KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9094 \
          -e KAFKA_CFG_ZOOKEEPER_CONNECT=localhost:2181 \
          -e KAFKA_DELETE_TOPIC_ENABLE=true \
          bitnamilegacy/kafka:${{ matrix.kafka-version }}

        # Wait for Kafka to be ready
        sleep 30

    - name: Run functional tests
      run: bundle exec rspec --profile --tag functional spec/functional
